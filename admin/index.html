<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Управление · CatManDog</title>
<link rel="stylesheet" href="/admin/admin.css"></head><body>
<main class="admin-shell"><header><a href="/">CatManDog</a><span>Управление магазином</span></header>
<section class="admin-login" id="admin-login"><h1>Вход для команды</h1><p>Введите ключ управления, сохранённый в Railway</p>
<form id="token-form"><label>Ключ доступа<input type="password" id="admin-token" autocomplete="off" required></label>
<button type="submit">Открыть панель</button></form><p id="login-error" role="alert"></p></section>
<section id="admin-panel" hidden><div class="admin-head"><div><h1>Заказы и каталог</h1><p>Адрес и время требуют ручного подтверждения до отправки</p></div>
<button type="button" id="admin-lock">Закрыть панель</button></div>
<nav><button type="button" data-tab="orders" aria-pressed="true">Заказы</button><button type="button" data-tab="variants" aria-pressed="false">Цены и остатки</button></nav>
<p id="admin-message" role="status"></p><div id="admin-content"></div></section></main>
<script type="module" src="/admin/admin.js"></script></body></html>
